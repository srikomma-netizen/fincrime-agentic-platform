name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core dependencies
        # Lean, deterministic set that exercises the real ML path (scikit-learn)
        # on Linux runners. Optional heavy libs (langgraph, faiss,
        # sentence-transformers, xgboost, provider SDKs) are not required — the
        # platform detects and falls back to them gracefully.
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" pydantic \
                      numpy pandas scikit-learn joblib httpx pytest

      - name: Generate synthetic data
        run: python scripts/generate_synthetic_data.py

      - name: Train models
        run: python scripts/train_models.py

      - name: Build vector index
        run: python scripts/build_vector_index.py

      - name: Run end-to-end demo
        run: python scripts/demo.py

      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest -q

      - name: Smoke-test the API
        run: |
          PYTHONPATH=src uvicorn app.main:app --app-dir src --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break || sleep 1
          done
          curl -sf http://localhost:8000/health
          curl -sf -X POST http://localhost:8000/cases \
            -H "content-type: application/json" \
            -d '{"role":"analyst","claim":{"claim_id":"CI-1","member_id":"MBR-1","member_name":"Test User","provider_id":"PROV-201","provider_name":"Clinic","vendor_id":"VEND-1000","amount":150,"procedure_code":"99213","diagnosis_code":"I10","claim_date":"2026-08-01","place_of_service":"office","prior_claims_30d":0,"avg_provider_amount":180}}' \
            | python -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='auto_cleared', d; print('API smoke OK:', d['status'])"
